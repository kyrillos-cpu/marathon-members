<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a4a">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marathon Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f5f8; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
  --brand:#0d2a4a; --accent:#f97316; --accent2:#fff7ed; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --r:14px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
a.btn{text-decoration:none}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px calc(12px) ;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:#fff url(icon-192.png) center/cover no-repeat;flex:none;font-size:0}
header .t1{font-weight:700;font-size:16px;line-height:1.1}
header .t2{font-size:12px;opacity:.7}
header .sp{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 100px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:600}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent)}
@media(min-width:900px){nav.tabs{top:0;bottom:auto;left:auto;right:16px;background:transparent;border:0;width:auto;gap:4px;padding:10px 0}nav.tabs button{flex:none;flex-direction:row;color:#cbd5e1;font-size:13px;padding:8px 10px;border-radius:10px}nav.tabs button.on{background:rgba(255,255,255,.12);color:#fff}header.top{padding-right:640px}main{padding-bottom:40px}}
h2{font-size:20px;margin:4px 0 12px;letter-spacing:-.3px}
h3{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.md2{grid-template-columns:1fr 1fr}}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.accent{background:var(--accent)} .btn.ghost{background:#eef0f4;color:var(--ink)} .btn.danger{background:#fee2e2;color:var(--err)} .btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px} .btn.block{width:100%} .btn.big{padding:16px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.5}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chk input{accent-color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef0f4;color:#334155;white-space:nowrap}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted)}
.score{font-weight:800;font-size:15px;text-align:right}
.stars{color:#f59e0b;font-size:12px;letter-spacing:1px}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.pill{border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.p-Present{background:#dcfce7;color:#166534}.p-Late{background:#fef3c7;color:#92400e}.p-Excused{background:#e0e7ff;color:#3730a3}
.p-Signed{background:#e0f2fe;color:#075985}.p-Confirmed{background:#dcfce7;color:#166534}.p-Attended{background:#16a34a;color:#fff}.p-No-show{background:#fee2e2;color:#991b1b}.p-Waitlist{background:#fef3c7;color:#92400e}
.t-Training{background:#dbeafe;color:#1e40af}.t-Carnival{background:#ffedd5;color:#9a3412}.t-Sunday{background:#cffafe;color:#155e75}.t-Follow-up{background:#ede9fe;color:#5b21b6}.t-Other{background:#eef0f4}
.rate{display:inline-flex;gap:1px}.rate button{background:none;border:0;font-size:19px;cursor:pointer;padding:0 1px;color:#d1d5db;line-height:1}.rate button.on{color:#f59e0b}
.search{position:relative}.search input{padding-left:36px}.search:before{content:"⌕";position:absolute;left:12px;top:8px;font-size:18px;color:var(--muted)}
.seg{display:inline-flex;background:#e9ebf0;border-radius:11px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fd{from{opacity:0}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.x{background:#eef0f4;border:0;border-radius:99px;width:32px;height:32px;font-size:16px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--sh);max-width:90vw;text-align:center}
#toast.err{background:var(--err)}#toast.ok{background:var(--ok)}
/* scanner */
#scanner{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#scanner .sh{color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
#reader{width:100%;max-width:520px;margin:0 auto;flex:1}
#reader video{object-fit:cover}
#scanRes{margin:10px 14px calc(14px + env(safe-area-inset-bottom));padding:16px;border-radius:16px;background:#1e293b;color:#fff;text-align:center;font-weight:700;font-size:18px;min-height:64px;transition:background .2s}
#scanRes.ok{background:var(--ok)}#scanRes.warn{background:var(--warn)}#scanRes.err{background:var(--err)}
/* member card */
.mcard{background:linear-gradient(160deg,#0f172a,#1e293b 60%,#7c2d12);color:#fff;border-radius:22px;padding:22px;text-align:center;max-width:360px;margin:0 auto}
.mcard .qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:14px 0}
.mcard .qr img,.mcard .qr canvas{display:block}
.mcard .n{font-size:22px;font-weight:800}
.qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px}
.login{max-width:380px;margin:9vh auto 0;text-align:center}
.login .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;box-shadow:var(--sh)}
.mission{border-left:4px solid var(--accent)}
.mission.Training{border-left-color:#2563eb}.mission.Follow-up{border-left-color:#7c3aed}
.tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
.right{text-align:right}.small{font-size:12px}.muted{color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.printgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{border:1.5px dashed #94a3b8;border-radius:14px;padding:12px;text-align:center;background:#fff;break-inside:avoid}
.pcard .qrbox{padding:4px}
@media print{header.top,nav.tabs,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff}.printgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top" id="hdr">
  <div class="logo">M</div>
  <div><div class="t1" id="svcName">Marathon Members</div><div class="t2" id="hdrSub">Servants follow-up</div></div>
  <div class="sp"></div>
  <span id="netBadge" class="badge hidden" style="background:#fbbf24;color:#000"></span>
  <button class="iconbtn hidden" id="refreshBtn" onclick="reload(true)">↻</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<nav class="tabs hidden" id="tabs"></nav>
<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>
<div id="scanner" class="hidden">
  <div class="sh"><div class="grow"><div style="font-weight:700" id="scanTitle">Scan</div><div class="small" style="opacity:.7" id="scanCount"></div></div><button class="iconbtn" onclick="closeScanner()">Done</button></div>
  <div id="reader"></div>
  <div id="scanRes">Point the camera at a member QR</div>
</div>

<script>
/* =================== CORE =================== */
const API = (window.MM_CONFIG||{}).API_URL || '';
const Q = new URLSearchParams(location.search);
let CODE = localStorage.getItem('mm_code') || '';
let S = null;                      // all data
let V = {view:'dash', sessionId:null, mFilter:'', mTeam:'', mSort:'name', misTab:'up', absQ:''};
let SC = {};                       // computed scores cache
const SESSION_TYPES = ['Sunday Meeting','Training','Carnival','Other'];
const MISSION_TYPES = ['Training','Carnival','Follow-up','Other'];
const ROLES = ['Servant','Team Lead','Coordinator','Leader'];

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowStr = () => { const d=new Date(); return `${todayStr()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const split = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function fmtD(s, withDay=true){ if(!s) return ''; const d=new Date(s.slice(0,10)+'T00:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('en-GB', withDay?{weekday:'short',day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'}); }
function initials(n){ const p=String(n||'?').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function teamColor(n){ const t=(S&&S.teams||[]).find(t=>t.Name===n); return t&&t.Color || '#64748b'; }
function memberColor(m){ return teamColor(split(m.Teams)[0]); }
function waPhone(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d='20'+d.slice(1); else if(d.length===10) d='20'+d; return d; }
function waLink(p, text){ return `https://wa.me/${waPhone(p)}?text=${encodeURIComponent(text)}`; }
function baseUrl(){ return location.origin + location.pathname; }
function cardUrl(id){ return baseUrl()+'?card='+encodeURIComponent(id); }
function joinUrl(){ return baseUrl()+'?join=1'; }
function typeCls(t){ return 't-'+(t==='Sunday Meeting'?'Sunday':(MISSION_TYPES.includes(t)||t==='Carnival'||t==='Training'?t:'Other')); }
function stars(score){ if(score==null) return '<span class="sub">—</span>'; const n=Math.round(score/20*2)/2; let s=''; for(let i=1;i<=5;i++) s+= n>=i?'★':(n>=i-.5?'⯪':'☆'); return `<span class="stars">${s}</span>`; }
function level(score){ if(score==null) return ['New','#94a3b8']; if(score>=85) return ['Star','#16a34a']; if(score>=70) return ['Active','#2563eb']; if(score>=50) return ['Average','#d97706']; return ['Needs follow-up','#dc2626']; }

function toast(msg, type=''){ const t=$('#toast'); t.textContent=msg; t.className=type; clearTimeout(t._h); t._h=setTimeout(()=>t.className='hidden', 2600); }
function modal(html){ $('#modalRoot').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; }
function mhead(title){ return `<div class="hd"><h3 class="mb0" style="font-size:18px">${title}</h3><button class="x" onclick="closeModal()">✕</button></div>`; }
function formData(id){ const f=document.getElementById(id); const o={}; new FormData(f).forEach((v,k)=>{ o[k]= o[k]!==undefined ? o[k]+', '+v : v; }); return o; }
function isNetErr(e){ return e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(String(e&&e.message)); }

async function api(action, data={}, admin=true){
  if(!API || API.includes('PASTE_')) throw new Error('API URL is not set in config.js');
  const res = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, data, code: admin?CODE:''})});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Error');
  return j.data;
}
async function run(btn, fn){ const b = btn&&btn.tagName?btn:null; if(b){b.disabled=true; b._t=b.innerHTML; b.innerHTML='…';} try{ return await fn(); } catch(e){ toast(e.message,'err'); throw e; } finally{ if(b){b.disabled=false; b.innerHTML=b._t;} } }

/* =================== QR =================== */
function qrInto(el, text, size=180){ if(!el) return; el.innerHTML=''; new QRCode(el,{text, width:size, height:size, correctLevel:QRCode.CorrectLevel.M}); }
function extractId(text){ const m=String(text||'').toUpperCase().match(/MM-\d+/); return m?m[0]:null; }
function cardCanvas(m, svc){
  const c=document.createElement('canvas'); c.width=720; c.height=980; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,720,980); g.addColorStop(0,'#0f172a'); g.addColorStop(.6,'#1e293b'); g.addColorStop(1,'#7c2d12');
  x.fillStyle=g; x.fillRect(0,0,720,980);
  x.fillStyle='#f97316'; x.fillRect(0,0,720,12);
  x.fillStyle='#fff'; x.textAlign='center';
  x.font='700 30px Inter, sans-serif'; x.fillText((svc||'Marathon Members').toUpperCase(),360,80);
  const tmp=document.createElement('div'); new QRCode(tmp,{text:cardUrl(m.ID),width:460,height:460,correctLevel:QRCode.CorrectLevel.M});
  const qc=tmp.querySelector('canvas');
  x.fillStyle='#fff'; roundRect(x,110,120,500,500,28); x.fill();
  x.drawImage(qc,130,140,460,460);
  x.fillStyle='#fff'; x.font='800 46px Inter, sans-serif'; wrapText(x, m.Name, 360, 700, 640, 54);
  x.font='600 30px Inter, sans-serif'; x.fillStyle='#fdba74'; x.fillText(m.ID, 360, 820);
  x.font='500 26px Inter, sans-serif'; x.fillStyle='#cbd5e1'; x.fillText(split(m.Teams).join(' • ')||'—', 360, 870);
  x.font='500 20px Inter, sans-serif'; x.fillStyle='#94a3b8'; x.fillText('Show this QR at every meeting, training & carnival', 360, 940);
  return c;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function wrapText(x,t,cx,y,maxW,lh){ const w=String(t).split(' '); let line='', lines=[]; w.forEach(word=>{ const tst=line?line+' '+word:word; if(x.measureText(tst).width>maxW && line){lines.push(line); line=word;} else line=tst; }); lines.push(line); lines.slice(0,2).forEach((l,i)=>x.fillText(l,cx,y+i*lh)); }
async function saveCard(m, svc){
  const c=cardCanvas(m, svc);
  const blob = await new Promise(r=>c.toBlob(r,'image/png'));
  const file = new File([blob], `${m.Name.replace(/\s+/g,'_')}_${m.ID}.png`, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:m.Name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
}

/* =================== SCORES =================== */
function num(v,d){ const n=Number(v); return isNaN(n)?d:n; }
function computeScores(){
  SC = {};
  if(!S) return;
  const st=S.settings||{}, t=todayStr();
  const req = split(st.REQUIRED_TYPES||'Sunday Meeting,Training');
  const tw = {'Sunday Meeting':num(st.TYPE_WEIGHT_SUNDAY,1),'Training':num(st.TYPE_WEIGHT_TRAINING,2),'Carnival':num(st.TYPE_WEIGHT_CARNIVAL,2),'Other':1};
  const W = {a:num(st.W_ATTENDANCE,50), c:num(st.W_COMMITMENT,20), p:num(st.W_PARTICIPATION,30)};
  const past = S.sessions.filter(s=>s.Date<=t).sort((a,b)=>a.Date<b.Date?1:-1);
  const att = {}; S.attendance.forEach(a=>{ (att[a.MemberID]=att[a.MemberID]||{})[a.SessionID]=a; });
  const missionSessions = {}; S.sessions.forEach(s=>{ if(s.MissionID) (missionSessions[s.MissionID]=missionSessions[s.MissionID]||[]).push(s.ID); });
  const misById = {}; S.missions.forEach(m=>misById[m.ID]=m);
  S.members.forEach(m=>{
    const my = att[m.ID]||{};
    const join = (m.JoinDate||'0000').slice(0,10);
    let wSum=0, wGot=0, reqCount=0, reqPresent=0, ratings=[], extra=0, recentMiss=0, recentChecked=0;
    past.forEach(s=>{
      const a = my[s.ID];
      if(a && a.Rating) ratings.push(Number(a.Rating));
      if(req.includes(s.Type)){
        if(s.Date < join) return;
        if(a && a.Status==='Excused') return;
        const w = tw[s.Type]||1; wSum+=w; reqCount++;
        if(a){ wGot += w*(a.Status==='Late'?0.75:1); reqPresent++; }
        if(recentChecked<3){ recentChecked++; if(!a) recentMiss++; }
      } else if(a) extra++;
    });
    // mission commitment
    let mSigned=0, mDone=0;
    S.signups.filter(x=>x.MemberID===m.ID).forEach(sg=>{
      const mi = misById[sg.MissionID]; if(!mi) return;
      if((mi.EndDate||mi.Date) > t) return;
      if(sg.Status==='Waitlist'||sg.Status==='Cancelled') return;
      const sess = missionSessions[mi.ID]||[];
      let done = sg.Status==='Attended' || sess.some(id=>my[id]);
      let known = done || sg.Status==='No-show' || sess.length>0;
      if(!known) return;
      mSigned++; if(done) mDone++;
    });
    const A = wSum? wGot/wSum*100 : null;
    const C = mSigned? mDone/mSigned*100 : null;
    const P = ratings.length? ratings.reduce((a,b)=>a+b,0)/ratings.length/5*100 : null;
    let tot=0, ww=0; if(A!=null){tot+=A*W.a; ww+=W.a;} if(C!=null){tot+=C*W.c; ww+=W.c;} if(P!=null){tot+=P*W.p; ww+=W.p;}
    let score = ww? tot/ww : null;
    if(score!=null) score = Math.min(100, score + Math.min(extra,5)); // small bonus for extra missions
    SC[m.ID] = {score: score==null?null:Math.round(score), A, C, P, reqCount, reqPresent, extra, mSigned, mDone,
      ratingAvg: ratings.length? (ratings.reduce((a,b)=>a+b,0)/ratings.length):null, ratingN:ratings.length,
      totalAttended: Object.keys(my).length, followUp: m.Status!=='Inactive' && recentChecked>=3 && recentMiss>=3};
  });
}

/* =================== OFFLINE QUEUE =================== */
function getQ(){ try{return JSON.parse(localStorage.getItem('mm_queue')||'[]');}catch(e){return [];} }
function setQ(q){ localStorage.setItem('mm_queue', JSON.stringify(q)); netBadge(); }
function netBadge(){ const n=getQ().length, b=$('#netBadge'); if(!b) return; b.classList.toggle('hidden', !n); b.textContent = `${n} pending`; }
let flushing=false;
async function flushQ(){
  const q=getQ(); if(!q.length||flushing||!CODE) return; flushing=true;
  try{
    const res = await api('checkinBatch',{items:q});
    const left=[];
    res.forEach((r,i)=>{
      const it=q[i];
      const loc=S&&S.attendance.find(a=>a.SessionID===it.SessionID&&a.MemberID===it.MemberID);
      if(r.ok){ if(loc){ Object.assign(loc, r.record); delete loc._pending; } }
      else if(/not found/i.test(r.error)){ if(S) S.attendance = S.attendance.filter(a=>a!==loc); }
      else left.push(it);
    });
    setQ(left); if(res.length) toast(`Synced ${res.length-left.length} check-ins`,'ok'); computeScores(); render();
  }catch(e){} finally{ flushing=false; }
}
window.addEventListener('online', flushQ);
setInterval(flushQ, 20000);

async function reload(showToast){
  try{
    $('#main').innerHTML = S? $('#main').innerHTML : '<div class="empty">Loading data…</div>';
    S = await api('bootstrap');
    // keep pending offline check-ins visible
    getQ().forEach(it=>{ if(!S.attendance.some(a=>a.SessionID===it.SessionID&&a.MemberID===it.MemberID)) S.attendance.push(Object.assign({Status:'Present',Rating:'',Note:''},it,{_pending:true})); });
    $('#svcName').textContent = S.settings.SERVICE_NAME || 'Marathon Members';
    document.title = S.settings.SERVICE_NAME || 'Marathon Members';
    $('#tabs').classList.remove('hidden'); $('#refreshBtn').classList.remove('hidden');
    computeScores(); render(); flushQ();
    if(showToast) toast('Updated','ok');
  }catch(e){
    if(/Wrong access code/.test(e.message)){ localStorage.removeItem('mm_code'); CODE=''; return viewLogin('Wrong code'); }
    if(!S) $('#main').innerHTML = `<div class="card empty">Could not load data.<br><b>${esc(e.message)}</b><br><br><button class="btn" onclick="reload()">Try again</button></div>`;
    else toast(e.message,'err');
  }
}

function localLate(s, time){ if(!s.StartTime||time.slice(0,10)!==s.Date) return 'Present'; const [h,mi]=s.StartTime.split(':').map(Number); const [th,tm]=time.slice(11,16).split(':').map(Number); return (th*60+tm) > (h*60+mi+num(S.settings.LATE_AFTER_MIN,15)) ? 'Late':'Present'; }
function findMemberLocal(key){ const id=extractId(key); if(id) return S.members.find(m=>m.ID===id); const p=String(key).replace(/\D/g,'').slice(-10); return p.length>=9? S.members.find(m=>String(m.Phone).replace(/\D/g,'').slice(-10)===p):null; }
async function doCheckin(sid, key, method='QR', status){
  const s=S.sessions.find(x=>x.ID===sid); const m=findMemberLocal(key);
  if(!m) return {type:'err', msg:'Unknown QR code'};
  if(m.Status==='Inactive') return {type:'warn', msg:`${m.Name} is inactive`};
  if(S.attendance.some(a=>a.SessionID===sid&&a.MemberID===m.ID)) return {type:'warn', msg:`${m.Name} — already checked in`};
  const time=nowStr();
  const rec={SessionID:sid, MemberID:m.ID, Time:time, Method:method, Status: status||localLate(s,time), Rating:'', Note:'', _pending:true};
  S.attendance.push(rec);
  api('checkin',{SessionID:sid, MemberID:m.ID, Time:time, Method:method, Status:status}).then(r=>{ Object.assign(rec, r.record); delete rec._pending; computeScores(); if(V.view==='session'&&$('#scanner').classList.contains('hidden')) render(); })
    .catch(e=>{ if(isNetErr(e)){ const q=getQ(); q.push({SessionID:sid, MemberID:m.ID, Time:time, Method:method, Status:status}); setQ(q); if(V.view==='session') render(); } else { S.attendance=S.attendance.filter(a=>a!==rec); toast(e.message,'err'); render(); } });
  computeScores();
  return {type:'ok', msg:`✓ ${m.Name}${rec.Status==='Late'?' (Late)':''}`};
}
async function manualCheck(sid, mid, status){ const r=await doCheckin(sid, mid, 'Manual', status); toast(r.msg, r.type==='ok'?'ok':(r.type==='err'?'err':'')); render(); }
async function rate(sid, mid, n){ const a=S.attendance.find(x=>x.SessionID===sid&&x.MemberID===mid); if(!a) return; a.Rating = Number(a.Rating)===n? '' : n; computeScores(); render(); try{ await api('setAttendance',{SessionID:sid, MemberID:mid, Rating:a.Rating}); }catch(e){ toast(e.message,'err'); } }
async function cycleStatus(sid, mid){ const a=S.attendance.find(x=>x.SessionID===sid&&x.MemberID===mid); const order=['Present','Late','Excused']; a.Status=order[(order.indexOf(a.Status)+1)%3]; computeScores(); render(); try{ await api('setAttendance',{SessionID:sid, MemberID:mid, Status:a.Status}); }catch(e){ toast(e.message,'err'); } }

let scanner=null, lastScan={id:null,t:0}, actx=null;
function beep(ok=true){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=ok?880:220; o.connect(g); g.connect(actx.destination); g.gain.value=.15; o.start(); o.stop(actx.currentTime+(ok?.12:.3)); }catch(e){} if(navigator.vibrate) navigator.vibrate(ok?60:[80,60,80]); }
function scanCount(){ const s=S.sessions.find(x=>x.ID===V.sessionId); $('#scanTitle').textContent=`${s.Title||s.Type} · ${fmtD(s.Date,false)}`; $('#scanCount').textContent=`${S.attendance.filter(a=>a.SessionID===s.ID).length} checked in${getQ().length?' · '+getQ().length+' waiting for internet':''}`; }
async function openScanner(){
  if(!V.sessionId) return;
  $('#scanner').classList.remove('hidden'); scanCount();
  const res=$('#scanRes'); res.className=''; res.textContent='Point the camera at a member QR';
  try{
    scanner = new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'}, {fps:12, qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.7);return {width:s,height:s};}, aspectRatio:1}, async text=>{
      const id = extractId(text)||text; const now=Date.now();
      if(lastScan.id===id && now-lastScan.t<3500) return; lastScan={id,t:now};
      const r = await doCheckin(V.sessionId, id, 'QR');
      res.className=r.type; res.textContent=r.msg; beep(r.type==='ok'); scanCount();
      clearTimeout(res._h); res._h=setTimeout(()=>{res.className=''; res.textContent='Ready for next…';}, 2500);
    }, ()=>{});
  }catch(e){ res.className='err'; res.textContent='Camera error: '+(e.message||e)+' — allow camera access'; }
}

  const t=todayStr(); const ms=S.missions.filter(m=>m.Status==='Open'&&(m.EndDate||m.Date)>=t).sort((a,b)=>a.Date<b.Date?-1:1);
  if(!ms.length) return `Marathon missions 🏃‍♂️\nNo open missions right now.\n${joinUrl()}`;
  return `📣 Open Marathon missions\n\n`+ms.map(m=>`⚑ ${m.Title}\n📅 ${fmtD(m.Date)}${m.Location?' · 📍 '+m.Location:''}`).join('\n\n')+`\n\nSign up here 👇\n${joinUrl()}`;
}
function announceLink(id){ return 'https://wa.me/?text='+encodeURIComponent(announceText(S.missions.find(x=>x.ID===id))); }
function copyMission(id){ const m=S.missions.find(x=>x.ID===id); const sg=S.signups.filter(x=>x.MissionID===id&&x.Status!=='Waitlist'); const lines=sg.map((x,i)=>`${i+1}. ${(S.members.find(y=>y.ID===x.MemberID)||{}).Name}${x.Team?' ('+x.Team+')':''}`);
  copyText(`⚑ ${m.Title}\n📅 ${fmtD(m.Date)}${m.EndDate&&m.EndDate!==m.Date?' → '+fmtD(m.EndDate):''}${m.Location?'\n📍 '+m.Location:''}\n\nTeam (${sg.length}):\n${lines.join('\n')}\n\nSign up: ${joinUrl()}`); }
async function delMission(id){ if(!confirm('Delete this mission and its sign-ups?')) return; await run(null,()=>api('deleteMission',{ID:id})); S.missions=S.missions.filter(m=>m.ID!==id); S.signups=S.signups.filter(s=>s.MissionID!==id); closeModal(); render(); }

/* =================== TEAMS =================== */
function vTeams(){
  return `<div class="row between"><h2>Teams</h2><button class="btn accent sm" onclick="teamForm()">+ New team</button></div>
  <div class="card list">${S.teams.map(t=>{ const ms=S.members.filter(m=>m.Status!=='Inactive'&&split(m.Teams).includes(t.Name)); const lead=S.members.find(m=>m.ID===t.Lead);
    const sc=ms.map(m=>SC[m.ID]&&SC[m.ID].score).filter(x=>x!=null); const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):'—';
    return `<div class="it" onclick="teamForm('${esc(t.Name)}')"><div class="av" style="background:${t.Color}">${esc(initials(t.Name).toUpperCase())}</div><div class="grow"><div class="nm">${esc(t.Name)}</div><div class="sub">${ms.length} members${lead?' · Lead: '+esc(lead.Name):''}</div></div><div class="right"><div class="score">${avg}</div><div class="sub">avg</div></div></div>`; }).join('')||'<div class="empty">No teams</div>'}</div>`;
}
function teamForm(name){
  const t=S.teams.find(x=>x.Name===name)||{Color:'#0891b2'};
  const ms=name?S.members.filter(m=>split(m.Teams).includes(name)):[];
  modal(`${mhead(name?esc(name):'New team')}
  <form id="tf" onsubmit="event.preventDefault();saveTeam(this)">
    <input type="hidden" name="OldName" value="${esc(t.Name||'')}">
    <label class="f">Team name *</label><input class="in" name="Name" required value="${esc(t.Name||'')}">
    <div class="grid g2"><div><label class="f">Color</label><input class="in" type="color" name="Color" value="${esc(t.Color)}" style="height:44px;padding:4px"></div>
    <div><label class="f">Team lead</label><select class="in" name="Lead"><option value="">—</option>${S.members.filter(m=>m.Status!=='Inactive').sort((a,b)=>a.Name.localeCompare(b.Name)).map(m=>`<option value="${m.ID}" ${t.Lead===m.ID?'selected':''}>${esc(m.Name)}</option>`).join('')}</select></div></div>
    <button class="btn accent block big mt16">Save</button>
  </form>
  ${name?`<h3 class="mt16">Members (${ms.length})</h3><div class="list">${ms.map(m=>`<div class="it" onclick="openMember('${m.ID}')">${avatar(m)}<div class="grow nm">${esc(m.Name)}</div><div class="score">${(SC[m.ID]||{}).score??'—'}</div></div>`).join('')||'<div class="sub">No members yet</div>'}</div>
  <button class="btn danger block mt16" onclick="delTeam('${esc(name)}')">Delete team</button>`:''}`);
}
async function saveTeam(f){ await run(f.querySelector('button'), ()=>api('saveTeam', formData('tf'))); closeModal(); reload(); toast('Saved ✓','ok'); }
async function delTeam(n){ if(!confirm(`Delete team "${n}"? Members stay, only the team is removed from them.`)) return; await run(null,()=>api('deleteTeam',{Name:n})); closeModal(); reload(); }

/* =================== SETTINGS =================== */
function vSettings(){
  const s=S.settings; const f=(k,l,type='text',ph='')=>`<label class="f">${l}</label><input class="in" type="${type}" name="${k}" value="${esc(s[k]||'')}" placeholder="${esc(ph)}">`;
  return `<h2>Settings</h2>
  <form id="stf" onsubmit="event.preventDefault();saveSettings(this)">
  <div class="card"><h3>General</h3>${f('SERVICE_NAME','Service name')}${f('LATE_AFTER_MIN','Late after (minutes from start time)','number')}
    ${f('REQUIRED_TYPES','Sessions everyone must attend (comma separated)','text','Sunday Meeting,Training')}
    <div class="sub mt8">Other session types (e.g. Carnival) don't count as absence — attending them gives bonus points.</div></div>
  <div class="card"><h3>Score formula (weights)</h3>
    <div class="grid g2">${f('W_ATTENDANCE','Attendance %','number')}${f('W_COMMITMENT','Mission commitment %','number')}${f('W_PARTICIPATION','Participation rating %','number')}<div></div>
    ${f('TYPE_WEIGHT_SUNDAY','Weight: Sunday meeting','number')}${f('TYPE_WEIGHT_TRAINING','Weight: Training','number')}</div>
    <div class="sub mt8">Score (0–100) = Attendance (late = 75%) + Missions they showed up for after signing up + Average stars you give, plus +1 per extra mission (max +5).</div></div>
  <div class="card"><h3>📅 Bookings sheet (confirmed dates → missions)</h3>
    ${f('BOOKING_SHEET_ID','Bookings Google Sheet link or ID','text','https://docs.google.com/spreadsheets/d/…')}
    ${f('BOOKING_TAB','Tab name (empty = first tab)')}
    ${f('BOOKING_CONFIRMED_VALUES','Status values that mean “confirmed” (comma separated)')}
    <details class="mt8"><summary>Column names (only if auto-detect is wrong)</summary>
      <div class="grid g2">${f('BOOKING_COL_STATUS','Status column')}${f('BOOKING_COL_DATE','Date column')}${f('BOOKING_COL_ENDDATE','End date column')}${f('BOOKING_COL_EPARCHY','Eparchy column')}${f('BOOKING_COL_TYPE','Type column')}${f('BOOKING_COL_KEY','ID column')}${f('BOOKING_COL_CONTACT','Contact name column')}${f('BOOKING_COL_PHONE','Phone column')}</div></details>
    <div class="sub mt8">Last sync: ${esc(s.LAST_BOOKING_SYNC||'never')}</div>
  </div>
  <button class="btn accent block big">Save settings</button>
  </form>
  <div class="card mt12"><h3>Export</h3><div class="grid g2"><button class="btn ghost" onclick="exportMembers()">Members + scores (CSV)</button><button class="btn ghost" onclick="exportAttendance()">Attendance (CSV)</button></div></div>
  <div class="card"><h3>Links</h3><div class="small">Sign-up page: <a href="${esc(joinUrl())}" target="_blank">${esc(joinUrl())}</a></div>
    <button class="btn danger block mt12" onclick="logout()">Log out</button></div>`;
}
async function saveSettings(f){ const d=formData('stf'); S.settings=await run(f.querySelector('button.big'), ()=>api('saveSettings',{settings:d})); computeScores(); render(); toast('Settings saved ✓','ok'); }
function csv(rows){ return '﻿'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'); }
function dl(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; a.click(); }
function exportMembers(){ const r=[['ID','Name','Phone','Teams','Role','Status','Score','Level','Attendance %','Commitment %','Avg rating','Extra missions']]; S.members.forEach(m=>{ const s=SC[m.ID]||{}; r.push([m.ID,m.Name,m.Phone,m.Teams,m.Role,m.Status,s.score??'',level(s.score)[0],s.A==null?'':Math.round(s.A),s.C==null?'':Math.round(s.C),s.ratingAvg?s.ratingAvg.toFixed(1):'',s.extra||0]); }); dl('marathon_members.csv', csv(r)); }
function exportAttendance(){ const r=[['Date','Session','Type','Member ID','Name','Status','Time','Rating','Method']]; S.attendance.forEach(a=>{ const s=S.sessions.find(x=>x.ID===a.SessionID)||{}; const m=S.members.find(x=>x.ID===a.MemberID)||{}; r.push([s.Date,s.Title||s.Type,s.Type,a.MemberID,m.Name,a.Status,a.Time,a.Rating,a.Method]); }); dl('marathon_attendance.csv', csv(r)); }

/* =================== PUBLIC: MEMBER CARD =================== */
async function viewCard(id){
  $('#hdrSub').textContent='Member card';
  $('#main').innerHTML='<div class="empty">Loading card…</div>';
  try{
    const m = await api('memberCard',{ID:id}, false);
    $('#svcName').textContent=m.serviceName||'Marathon Members';
    $('#main').innerHTML = `<div class="mcard"><div class="small" style="letter-spacing:1px;font-weight:700;color:#fdba74">${esc((m.serviceName||'Marathon Members').toUpperCase())}</div>
      <div class="qr" id="cq"></div><div class="n">${esc(m.Name)}</div><div style="color:#fdba74;font-weight:700;margin-top:4px">${esc(m.ID)}</div><div class="small mt8" style="color:#cbd5e1">${esc(split(m.Teams).join(' • '))}</div>
      <div class="small mt12" style="color:#94a3b8">Show this QR at every meeting, training & carnival</div></div>
      <div style="max-width:360px;margin:14px auto 0" class="grid"><button class="btn accent big" onclick='saveCard(${JSON.stringify(m).replace(/'/g,"&#39;")}, ${JSON.stringify(m.serviceName||"")})'>⬇ Save card to phone</button>
      <a class="btn ghost" href="?join=1">Sign up for a mission →</a></div>`;
    qrInto($('#cq'), cardUrl(m.ID), 230);
  }catch(e){ $('#main').innerHTML=`<div class="card empty">${esc(e.message)}</div>`; }
}

/* =================== PUBLIC: JOIN MISSIONS =================== */
let ME = null, PUB = null;
try{ ME = JSON.parse(localStorage.getItem('mm_me')||'null'); }catch(e){}
async function viewJoin(){
  $('#hdrSub').textContent='Mission sign-up';
  if(!ME) return joinLogin();
  $('#main').innerHTML='<div class="empty">Loading missions…</div>';
  try{
    const [me, pub] = await Promise.all([api('lookupMember',{key:ME.ID},false), api('publicMissions',{},false)]);
    ME=me; PUB=pub; localStorage.setItem('mm_me', JSON.stringify({ID:me.ID, Name:me.Name}));
    $('#svcName').textContent=pub.serviceName||'Marathon Members';
    renderJoin();
  }catch(e){ if(/find you|inactive|not found/i.test(e.message)){ localStorage.removeItem('mm_me'); ME=null; return joinLogin(e.message); } $('#main').innerHTML=`<div class="card empty">${esc(e.message)}<br><br><button class="btn" onclick="viewJoin()">Try again</button></div>`; }
}
function joinLogin(err){
  $('#main').innerHTML=`<div class="login card"><div class="logo">M</div><h2>Mission sign-up</h2><p class="sub">Enter your mobile number (or member ID from your card)</p>
  <form onsubmit="event.preventDefault();joinFind(this)"><input class="in" name="k" inputmode="tel" placeholder="01xxxxxxxxx" required style="text-align:center;font-size:17px">
  ${err?`<div class="small" style="color:var(--err);margin-top:6px">${esc(err)}</div>`:''}<button class="btn accent block big mt12">Continue</button></form></div>`;
}
async function joinFind(f){ try{ const me=await run(f.querySelector('button'), ()=>api('lookupMember',{key:f.k.value},false)); ME=me; localStorage.setItem('mm_me', JSON.stringify({ID:me.ID,Name:me.Name})); viewJoin(); }catch(e){} }
function renderJoin(){
  const mine={}; (ME.signups||[]).forEach(s=>mine[s.MissionID]=s);
  $('#main').innerHTML = `<div class="card"><div class="row between"><div><div class="sub">Hello 👋</div><div class="nm" style="font-size:18px">${esc(ME.Name)}</div><div class="sub">${esc(ME.ID)} · ${esc(split(ME.Teams).join(', '))}</div></div>
    <div class="grid"><a class="btn sm ghost" href="?card=${encodeURIComponent(ME.ID)}">My QR card</a><button class="btn sm ghost" onclick="localStorage.removeItem('mm_me');ME=null;joinLogin()">Not me</button></div></div></div>
  <h2>Open missions</h2>
  ${PUB.missions.map(m=>{ const s=mine[m.ID]; const slots=Number(m.SlotsNeeded||0);
    return `<div class="card mission ${esc(m.Type)}"><div class="row between"><span class="tag">${esc(m.Type)}</span>${s?`<span class="pill p-${s.Status}">${s.Status==='Signed'?'You’re in ✓':s.Status}</span>`:''}</div>
    <div class="nm mt8" style="font-size:17px;white-space:normal">${esc(m.Title)}</div>
    <div class="sub">📅 ${fmtD(m.Date)}${m.EndDate&&m.EndDate!==m.Date?' → '+fmtD(m.EndDate):''}${m.Location?'<br>📍 '+esc(m.Location):''}</div>
    ${m.Notes?`<div class="small mt8">${esc(m.Notes)}</div>`:''}
    <div class="small mt8"><b>${m.Signed}</b>${slots?' / '+slots:''} servants signed up</div>${slots?`<div class="bar mt8"><i style="width:${Math.min(100,m.Signed/slots*100)}%"></i></div>`:''}
    ${s? (s.Status==='Attended'?'':`<button class="btn ghost block mt12" onclick="pubCancel('${m.ID}',this)">Cancel my sign-up</button>`)
       : `<button class="btn accent block big mt12" onclick="pubSign('${m.ID}',this)">Sign me up</button>`}
    </div>`; }).join('') || '<div class="card empty">No open missions right now. Check again soon 🙏</div>'}`;
}
async function pubSign(id,b){ const r=await run(b, ()=>api('signup',{MissionID:id, key:ME.ID},false)); toast(r.Status==='Waitlist'?'Added to waitlist':'Signed up ✓','ok'); viewJoin(); }
async function pubCancel(id,b){ if(!confirm('Cancel your sign-up?')) return; await run(b, ()=>api('cancelSignup',{MissionID:id, key:ME.ID},false)); toast('Cancelled'); viewJoin(); }

boot();
</script>
